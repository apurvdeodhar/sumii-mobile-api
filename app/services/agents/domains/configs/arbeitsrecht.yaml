# Arbeitsrecht (Employment Law) — Domain Configuration
# Covers: termination, salary disputes, workplace issues, discrimination, non-compete
# CRITICAL: 3-week Kündigungsschutzklage deadline — must always be checked!
# i do not understand this shit, ask Nick !

name: "Arbeitsrecht"
name_en: "Employment Law"
agent_name: "Arbeitsrecht Agent"
description: >
  Employment law intake agent for termination disputes, salary issues,
  workplace problems, and discrimination claims. Critical: always checks
  3-week Kündigungsschutzklage deadline. Handles both dispute resolution
  and employment contract drafting intents.

intake_questions:
  dispute: |
    Ask these domain-specific questions ONE AT A TIME:

    **CRITICAL — TERMINATION DEADLINE CHECK:**
    If the user mentions ANY form of termination (Kündigung), IMMEDIATELY ask:
    DE: "Wann hast du die Kündigung erhalten? WICHTIG: Für eine Kündigungsschutzklage
    gilt eine Frist von nur 3 Wochen ab Zugang!"
    EN: "When did you receive the termination? IMPORTANT: You only have 3 weeks
    from receipt to file an unfair dismissal claim!"

    1. **Role** — Are you the employee or employer?
       DE: "Bist du Arbeitnehmer oder Arbeitgeber?"

    2. **Issue Type** — What kind of employment issue?
       - Termination (Kündigung) — ordentlich or außerordentlich?
       - Salary dispute (Gehaltsstreit)?
       - Workplace issue (Mobbing, Diskriminierung)?
       - Working conditions?
       - Non-compete clause (Wettbewerbsverbot)?
       - Reference letter dispute (Arbeitszeugnis)?
       DE: "Um welche Art von Arbeitsproblem handelt es sich?"

    3. **Employment Details** — Basic employment info:
       - How long have you been employed?
       - Full-time or part-time?
       - Current position?
       DE: "Wie lange arbeitest du dort und in welcher Position?"

    4. **Company Size** — How many employees?
       (Relevant for Kündigungsschutzgesetz: applies if >10 employees)
       DE: "Wie viele Mitarbeiter hat das Unternehmen ungefähr?"

    5. **Termination Details** (if applicable):
       - Type: ordinary (ordentlich) or extraordinary (außerordentlich/fristlos)?
       - Written? Signed?
       - Reason given?
       - Notice period stated?
       DE: "War die Kündigung schriftlich? Wurde ein Grund angegeben?"

    6. **Prior Warnings** — Were there previous warnings (Abmahnungen)?
       DE: "Gab es vorher Abmahnungen?"

    7. **Works Council** — Is there a works council (Betriebsrat)?
       - Was the Betriebsrat consulted before termination?
       DE: "Gibt es einen Betriebsrat? Wurde er angehört?"

    8. **Special Protection** — Any special termination protection?
       - Pregnant? On parental leave?
       - Severely disabled (Schwerbehinderung)?
       - Works council member?
       - In probationary period (Probezeit)?
       DE: "Bist du schwanger, schwerbehindert, Betriebsratsmitglied oder in der Probezeit?"

    9. **Salary Details** (if salary dispute):
       - Gross monthly salary?
       - What is owed?
       - Since when?
       DE: "Wie hoch ist dein Bruttogehalt? Was genau wird nicht gezahlt?"

  drafting: |
    Ask these domain-specific questions ONE AT A TIME:

    1. **Document Type** — What kind of document?
       - Employment contract (Arbeitsvertrag)?
       - Termination letter (Kündigung)?
       - Settlement agreement (Aufhebungsvertrag)?
       - Reference letter request (Arbeitszeugnis)?
       DE: "Was für ein Dokument brauchst du?"

    2. **Employment Type** — What kind of employment?
       - Permanent (unbefristet) or fixed-term (befristet)?
       - Full-time or part-time? Minijob?
       DE: "Unbefristet oder befristet? Vollzeit oder Teilzeit?"

    3. **Parties** — Employer and employee details?
       DE: "Wer ist der Arbeitgeber? Wer ist der Arbeitnehmer?"

    4. **Position & Duties** — Job role and responsibilities?
       DE: "Welche Position und welche Aufgaben sind vorgesehen?"

    5. **Salary** — Compensation details?
       - Gross salary, bonuses, benefits?
       DE: "Wie hoch soll das Gehalt sein? Gibt es Boni oder Zusatzleistungen?"

    6. **Probation** — Probationary period?
       - Duration (typically 6 months max)?
       DE: "Soll eine Probezeit vereinbart werden?"

    7. **Non-Compete** — Post-employment restrictions?
       DE: "Soll ein nachvertragliches Wettbewerbsverbot enthalten sein?"

    8. **Special Clauses** — Any specific provisions?
       - Working hours, home office, overtime rules?
       DE: "Gibt es besondere Regelungen (Homeoffice, Überstunden, etc.)?"

completion_criteria: |
  - Role identified (employee or employer)
  - Issue type classified (termination, salary, workplace, etc.)
  - Employment duration and position known
  - Company size known (for KSchG applicability)
  - For termination: date received, type, reason, written/signed status
  - Kündigungsschutzklage deadline checked (3 weeks from receipt!)
  - Prior warnings (Abmahnungen) documented
  - Works council status known
  - Special protection status checked (pregnancy, disability, etc.)
  - User's specific goal stated
  - Insurance status asked

examples: |
  <<<FEW-SHOT EXAMPLE: ARBEITSRECHT INTAKE>>>

  User: "Ich habe gestern meine Kündigung bekommen"
  Agent: "Das ist eine wichtige Sache. Wann genau hast du die Kündigung erhalten?
  Wichtig: Für eine Kündigungsschutzklage hast du nur 3 Wochen Zeit ab Zugang."
  User: "Gestern per Brief"
  Agent: "Okay, dann läuft die Frist ab gestern. Bist du Arbeitnehmer?"
  User: "Ja"
  Agent: "Wie lange arbeitest du bei dem Unternehmen und in welcher Position?"
  User: "Seit 5 Jahren als Softwareentwickler"
  Agent: "War die Kündigung schriftlich und unterschrieben? Wurde ein Grund angegeben?"
